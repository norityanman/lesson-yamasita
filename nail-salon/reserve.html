<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>空き状況 | Nail Salon Sample</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body class="xmas">

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="logo">Nail Salon Sample</a>
    <nav aria-label="メニュー">
      <a href="index.html#recruit">スタッフ募集</a>
      <a href="index.html#about">お店について</a>
      <a href="index.html#menu">メニュー</a>
      <a href="index.html#hours">営業時間</a>
      <a href="reserve.html" aria-current="page">空き状況</a>
    </nav>
  </div>
</header>

<main>
  <section class="section">
    <div class="wrap narrow stack" style="gap:28px">
      <div class="heading"><p class="en">Availability</p><h2>空き状況</h2></div>
      <p class="cal-intro">ご希望の日を選ぶと、ホットペッパービューティーの予約画面へ進めます。<br>お時間は、ホットペッパーの予約画面でお選びください。</p>

      <ul class="cal-legend" aria-label="記号の見かた">
        <li><span class="mark s-open">◎</span>空き</li>
        <li><span class="mark s-few">△</span>残りわずか</li>
        <li><span class="mark s-full">×</span>満席</li>
        <li><span class="mark s-off">休</span>お休み</li>
      </ul>

      <div class="card cal">
        <div class="cal-head">
          <button type="button" class="cal-nav" id="prev" aria-label="前の月">‹</button>
          <h3 id="cal-title" aria-live="polite"></h3>
          <button type="button" class="cal-nav" id="next" aria-label="次の月">›</button>
        </div>
        <div class="cal-grid cal-week" aria-hidden="true">
          <span class="sun">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="sat">土</span>
        </div>
        <div class="cal-grid" id="cal-days"></div>
      </div>

      <div class="card cal-picked" id="picked" aria-live="polite">
        <p class="picked-empty">カレンダーから日にちを選んでください。</p>
      </div>

      <p class="note">※空き状況はこまめに更新していますが、行き違いになることがあります。最新の状況はホットペッパーの予約画面でご確認ください。</p>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p class="name">Nail Salon Sample</p>
    <small>© Nail Salon Sample</small>
  </div>
</footer>

<script src="availability.js"></script>
<script>
(function () {
  var MONTHS_AHEAD = 1;   // 今月から何か月先まで見られるか（1 = 今月と来月）
  var data = window.AVAILABILITY || {};
  var bookUrl = window.HOTPEPPER_URL || "https://beauty.hotpepper.jp/";
  var WEEK = ["日", "月", "火", "水", "木", "金", "土"];
  var STATUS = {
    "空き":       { cls: "s-open", mark: "◎", label: "空きあり",   bookable: true },
    "残りわずか": { cls: "s-few",  mark: "△", label: "残りわずか", bookable: true },
    "満席":       { cls: "s-full", mark: "×", label: "満席",       bookable: false },
    "休み":       { cls: "s-off",  mark: "休", label: "お休み",     bookable: false }
  };
  var UNKNOWN = { cls: "s-ask", mark: "－", label: "ホットペッパーでご確認ください", bookable: true };
  var PAST    = { cls: "s-past", mark: "",  label: "受付終了",                         bookable: false };

  var now = new Date();
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var first = new Date(today.getFullYear(), today.getMonth(), 1);
  var offset = 0;
  var selectedKey = null;

  var titleEl = document.getElementById("cal-title");
  var daysEl = document.getElementById("cal-days");
  var pickedEl = document.getElementById("picked");
  var prevBtn = document.getElementById("prev");
  var nextBtn = document.getElementById("next");

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function keyOf(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function jpDate(d) { return (d.getMonth() + 1) + "月" + d.getDate() + "日（" + WEEK[d.getDay()] + "）"; }

  function statusOf(d) {
    if (d < today) return PAST;
    var v = data[keyOf(d)];
    if (v === undefined) return UNKNOWN;
    if (!STATUS[v]) { console.warn("availability.js：「" + v + "」は使えない書き方です（" + keyOf(d) + "）"); return UNKNOWN; }
    return STATUS[v];
  }

  function render() {
    var m = new Date(first.getFullYear(), first.getMonth() + offset, 1);
    titleEl.textContent = m.getFullYear() + "年 " + (m.getMonth() + 1) + "月";
    prevBtn.disabled = offset <= 0;
    nextBtn.disabled = offset >= MONTHS_AHEAD;
    daysEl.innerHTML = "";

    for (var i = 0; i < m.getDay(); i++) daysEl.appendChild(document.createElement("span"));

    var last = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
    for (var day = 1; day <= last; day++) {
      var d = new Date(m.getFullYear(), m.getMonth(), day);
      var st = statusOf(d);
      var b = document.createElement("button");
      b.type = "button";
      b.className = "cal-day " + st.cls + (d.getDay() === 0 ? " sun" : d.getDay() === 6 ? " sat" : "");
      if (+d === +today) b.className += " is-today";
      b.disabled = !st.bookable;
      b.dataset.key = keyOf(d);
      b.setAttribute("aria-label", jpDate(d) + " " + st.label + (+d === +today ? "（今日）" : ""));
      b.setAttribute("aria-pressed", selectedKey === keyOf(d) ? "true" : "false");
      b.innerHTML = '<span class="num">' + day + '</span><span class="mark" aria-hidden="true">' + st.mark + "</span>";
      b.addEventListener("click", (function (date, status) {
        return function () { pick(date, status); };
      })(d, st));
      daysEl.appendChild(b);
    }
  }

  function pick(d, st) {
    selectedKey = keyOf(d);
    var btns = daysEl.querySelectorAll(".cal-day");
    for (var i = 0; i < btns.length; i++) {
      btns[i].setAttribute("aria-pressed", btns[i].dataset.key === selectedKey ? "true" : "false");
    }
    pickedEl.innerHTML =
      '<p class="picked-date">' + jpDate(d) + "</p>" +
      '<p class="picked-status"><span class="mark ' + st.cls + '">' + st.mark + "</span>" + st.label + "</p>" +
      '<a class="btn" href="' + bookUrl + '">' +
        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>' +
        "ホットペッパーで予約する</a>" +
      '<p class="picked-hint">予約画面で、この日をお選びください。</p>';
  }

  prevBtn.addEventListener("click", function () { if (offset > 0) { offset--; render(); } });
  nextBtn.addEventListener("click", function () { if (offset < MONTHS_AHEAD) { offset++; render(); } });
  render();
})();
</script>
</body>
</html>
